<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WORKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">WORKS</h1>
    <p class="site-sub">Personal Portfolio</p>
  </header>

  <main>
    <!-- 10 -> 02, 2/3/3/1 피라미드 그리드 -->
    <section id="grid" class="grid" aria-label="프로젝트 목록"></section>

    <!-- University 단독 섹션 -->
    <section class="university-section">
      <h2 class="university-label">University</h2>
      <div id="university-feature" class="university-feature"></div>
    </section>
  </main>

  <!-- 상세페이지(오버레이): 슬라이드 + 정보패널 -->
  <div id="detail" class="detail" hidden>
    <button class="detail-close" id="detail-close" aria-label="닫기">✕</button>

    <div class="detail-slide">
      <button class="slide-arrow slide-prev" id="slide-prev" aria-label="이전 이미지">‹</button>
      <img id="slide-img" class="slide-img" src="" alt="" />
      <button class="slide-arrow slide-next" id="slide-next" aria-label="다음 이미지">›</button>
      <div class="slide-counter" id="slide-counter"></div>
    </div>

    <aside class="detail-info">
      <h3 id="detail-title"></h3>
      <p id="detail-id" class="detail-id"></p>
      <div id="detail-thumbs" class="detail-thumbs"></div>
    </aside>
  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
